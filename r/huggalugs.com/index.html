.cta-band p { color: rgba(255,255,255,.6); font-weight: 300; max-width: 600px; margin: 0 auto 28px; }
.cta { display: inline-block; background: var(--accent); color: var(--white); text-decoration: none; font-weight: 600; font-size: 17px; padding: 15px 28px; border-radius: 999px; }
.foot { background: var(--cream); padding: 40px 20px; font-size: 14.5px; color: var(--stone); }
.foot .in { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
.foot ul { padding-left: 18px; margin: 8px 0 0; } .foot li { margin: 4px 0; }

<script type="application/json" id="data">{"store": {"name": "Huggalugs", "site": "huggalugs.com", "url": "https://huggalugs.com", "category": "kids hats and knitwear"}, "for": {"name": "Carol Lavinthal", "title": "Founder and President"}, "date": "November 6, 2026", "book": "https://calendly.com/d/cnwz-qmf-sby/ad-consult-w-will-tristan-eddie", "findings": [{"kind": "no_shipping_badge", "stat": "3", "stat_label": "stores show a free shipping or returns badge", "headline": "On a Google Shopping search for \"Huggalugs Football Sweater for Baby & Toddler\", 3 stores show a free shipping or free returns badge. Your listing shows none.", "why": "Shoppers compare these badges at a glance. If you already offer free shipping or returns, the badge often needs only a setting in your Google listing.", "proof": [{"label": "The search on Google Shopping", "link": "https://www.google.com/search?q=Huggalugs%20Football%20Sweater%20for%20Baby%20%26%20Toddler&hl=en&gl=US&udm=28&gws_rd=cr&uule=w+CAIQIFISCQs2MuSEtepUEUK33kOSuTsc"}], "checked": "November 6, 2026"}, {"kind": "no_ads", "stat": "0", "stat_label": "ads we found on Google, Facebook or Instagram", "headline": "We can't find any ad of yours on Google, Facebook or Instagram.", "why": "None in Google's ad library in the past 30 days, and none live in Meta's ad library.", "proof": [{"label": "Google's ad library", "link": "https://adstransparency.google.com/?region=US&domain=huggalugs.com&preset-date=Last+30+days"}, {"label": "A Google search we ran", "link": "https://www.google.com/search?q=baby%20winter%20hat&hl=en&gl=US&ie=UTF-8&uule=w+CAIQIFISCQs2MuSEtepUEUK33kOSuTsc"}], "checked": "November 6, 2026"}]}</script>
<script>
"use strict";
// Renders one store's free report from the JSON above. The page builder writes that JSON; this script only shows it.
(() => {
  const t0 = performance.now();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => /^https:\/\//.test(String(u || "")) ? String(u) : "";
  let d;
  try { d = JSON.parse(document.getElementById("data").textContent); }
  catch (err) { console.error("[free-report] data: parse failed", String(err)); return; }
  console.log("[free-report] render: start", { store: d.store?.site, findings: d.findings?.length });
  const words = ["no things", "1 thing", "2 things", "3 things"];
  const n = d.findings.length;
  document.getElementById("hero").innerHTML =
    `<p class="kicker">Free report · ${esc(d.store.category)}</p>` +
    `<h1>${esc(words[n] || n + " things")} we found on ${esc(d.store.site)}</h1>` +
    `<p class="lede">We read only public data: Google Shopping, Google's and Meta's ad libraries, Google's own speed test, and your site as any visitor sees it. We needed no access to your accounts.</p>` +
    `<p class="for">Prepared for <b>${esc(d.for.name)}${d.for.title ? ", " + esc(d.for.title) : ""} of ${esc(d.store.name)}</b> · ${esc(d.date)}</p>`;
  document.getElementById("finds").innerHTML = d.findings.map((f, i) =>
    `<article class="find"><div class="stat"><b>${esc(f.stat)}</b><span>${esc(f.stat_label)}</span></div>` +
    `<div><p class="num">0${i + 1}</p><h2>${esc(f.headline)}</h2><p class="why">${esc(f.why)}</p>` +
    `<div class="proof"><span>Proof, checked ${esc(f.checked)}:</span>` +
    f.proof.filter(p => safeUrl(p.link)).map(p => `<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${esc(p.label)} ↗</a>`).join("") +
    `</div></div></article>`).join("");
  document.getElementById("foot").innerHTML =
    `<div><b>How we made this report</b><ul><li>Public data only: Google Shopping, Google's and Meta's ad libraries, Google's speed test, and your site's public pages.</li>` +
    `<li>We never clicked your ads, sent your forms, or placed an order.</li><li>Each finding links to its proof. Public data changes daily.</li></ul></div>` +
    `<div><b>DigitalWill Ads LLC</b><br>digitalwillads.com<br><span style="font-size:13px">Prepared ${esc(d.date)} for ${esc(d.store.name)} only.</span></div>`;
  document.querySelectorAll("[data-book]").forEach(a => { a.href = safeUrl(d.book) || "https://digitalwillads.com"; });
  console.log("[free-report] render: done", { store: d.store.site, findings: n, ms: Math.round(performance.now() - t0) });
})();
</script>
